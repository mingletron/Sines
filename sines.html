<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tek Sines — Oscilloscope</title>
<style>
:root {
    --bg: #040806;
    --panel: #0a150a;
    --panel-2: #0f1a0f;
    --border: #1a351a;
    --text: #c8e8c8;
    --muted: #6a8a6a;
    --accent: #4aff8a;
    --accent-dim: #2ac86a;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px 60px;
    background: radial-gradient(1200px 600px at 50% -10%, #081208, var(--bg));
    color: var(--text);
    font: 400 14px/1.5 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace;
}
.app { max-width: 1000px; margin: 0 auto; }
header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
}
header .brand { display: flex; align-items: center; gap: 10px; }
#powerLed {
    width: 12px; height: 12px; border-radius: 50%;
    background: #1a0; border: 2px solid #060;
    box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 8px #0a0;
    transition: all 0.3s ease;
}
#powerLed.on {
    background: #0f0; border-color: #0a0;
    box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 18px #0f0, 0 0 36px #0f0;
    animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 18px #0f0, 0 0 36px #0f0; }
    50% { opacity: 0.7; box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 12px #0f0, 0 0 24px #0f0; }
}
header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; color: var(--accent); }
header .sub { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }

.screen {
    position: relative;
    padding: 16px;
    background: #040806;
    border: 3px solid #0d1a0d;
    border-radius: 18px;
    box-shadow:
        0 0 0 2px #0a150a,
        0 0 0 4px #142814,
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 120px rgba(80, 200, 120, 0.02),
        inset 0 0 0 1px rgba(80, 200, 120, 0.05);
    overflow: hidden;
}
.screen::before {
    content: "";
    position: absolute; inset: 16px; border-radius: 8px; pointer-events: none; z-index: 10;
    background:
        radial-gradient(ellipse 80% 60% at 50% 50%, transparent 60%, rgba(0,0,0,0.5) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.06), rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    background-size: 100% 100%, 100% 4px;
}
.screen::after {
    content: "";
    position: absolute; inset: 14px; pointer-events: none; border-radius: 10px; z-index: 11;
    box-shadow:
        inset 0 0 0 1px rgba(80, 200, 120, 0.1),
        inset 0 0 80px rgba(80, 200, 120, 0.03),
        inset 0 -40px 60px rgba(80, 200, 120, 0.02);
}
#myCanvas {
    display: block; width: 100%; height: auto; border-radius: 6px;
    background: #020602;
}

.panel {
    margin-top: 18px; padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
}
.controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.control { display: flex; align-items: center; gap: 10px; }
.control > label { color: var(--muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
.readout {
    min-width: 50px; padding: 5px 10px;
    text-align: center; font-variant-numeric: tabular-nums; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--accent); font-family: inherit;
}
.spacer { flex: 1; }

button {
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 9px 18px; cursor: pointer;
    color: #06210f;
    background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    border: none; border-radius: 10px;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
    transition: transform .06s ease, filter .15s ease, border-color .15s ease, color .15s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.secondary {
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); box-shadow: none;
}
button.secondary:hover { border-color: var(--accent); color: var(--accent); filter: none; }
button.small { padding: 7px 13px; font-size: 12px; }
button.ghost {
    color: var(--muted); background: transparent;
    border: 1px solid var(--border); box-shadow: none;
    padding: 5px 11px; font-size: 12px; line-height: 1;
}
button.ghost:hover { color: #ff7676; border-color: #ff7676; filter: none; }

input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 6px; margin: 0;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #06210f;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
}
input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #06210f;
}

input[type=text], select {
    font: inherit; font-size: 13px;
    padding: 6px 9px; width: 92px;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px;
}
select { width: auto; }
input[type=text]:focus, select:focus, input[type=range]:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
}

table { width: 100%; border-collapse: collapse; margin-top: 4px; }
thead th {
    padding: 8px 12px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--border);
}
tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

.toggle {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 54px; padding: 4px 0;
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    cursor: pointer; user-select: none; border-radius: 999px;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--border);
    transition: color .15s ease, background .15s ease, border-color .15s ease;
}
.toggle.on { color: var(--accent); background: rgba(74, 222, 128, 0.15); border-color: var(--accent-dim); }

.add-row { margin-top: 16px; }

.presets { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.presets .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-right: 2px; }
</style>
</head>
<body>
<div class="app">
<header>
    <div class="brand">
        <span id="powerLed"></span>
        <strong>TEK SINES</strong>
    </div>
    <h1>OSCILLOSCOPE</h1>
    <span class="sub">additive sine synthesis</span>
</header>
<div class="screen">
<canvas id="myCanvas" width="1000" height="600">
Your browser does not support the HTML5 canvas tag.
</canvas>
</div>

<script>
const c = document.getElementById("myCanvas");
const kSampleRate = 44100;
const kNumSamples = kSampleRate * 2;
const kFrequency  = 440;
const kPI_2       = Math.PI * 2;
const amp         = 0.2;
let gain = 0.8;
let zoom = 1;
const ctx = c.getContext("2d");

let persistFrames = [];
const MAX_PERSIST = 4;

function getSampleRate() {
    return (typeof aud !== 'undefined' && aud && aud.sampleRate) ? aud.sampleRate : kSampleRate;
}

const notes = [

{ "note":"C#3/Db3", "freq":"138.59" },
{ "note":"D3", "freq":"146.83" },
{ "note":"D#3/Eb3", "freq":"155.56" },
{ "note":"E3", "freq":"164.81" },
{ "note":"F3", "freq":"174.61" },
{ "note":"F#3/Gb3", "freq":"185.00" },
{ "note":"G3", "freq":"196.00" },

{ "note":"B3", "freq":"246.94" },

{ "note":"C#4/Db4", "freq":"277.18" },
{ "note":"D4", "freq":"293.66" },
{ "note":"D#4/Eb4", "freq":"311.13" },
{ "note":"E4", "freq":"329.63" },

{ "note":"G#5/Ab5", "freq":"830.61" },
{ "note":"A5", "freq":"880.00" },
{ "note":"A#5/Bb5", "freq":"932.33" },

{ "note":"C6", "freq":"1046.50" },
{ "note":"C#6/Db6", "freq":"1108.73" },

{ "note":"F#7/Gb7", "freq":"2959.96" },
{ "note":"G7", "freq":"3135.96" },
{ "note":"G#7/Ab7", "freq":"3322.44" },
{ "note":"A7", "freq":"3520.00" },
{ "note":"A#7/Bb7", "freq":"3729.31" },
{ "note":"B7", "freq":"3951.07" },
{ "note":"C8", "freq":"4186.01" },
{ "note":"C#8/Db8", "freq":"4434.92" },
{ "note":"D8", "freq":"4698.63" },
{ "note":"D#8/Eb8", "freq":"4978.03" },
{ "note":"E8", "freq":"5274.04" },
{ "note":"F8", "freq":"5587.65" },
{ "note":"F#8/Gb8", "freq":"5919.91" },
{ "note":"G8", "freq":"6271.93" },
{ "note":"G#8/Ab8", "freq":"6644.88" },
{ "note":"A8", "freq":"7040.00" },
{ "note":"A#8/Bb8", "freq":"7458.62" },
{ "note":"B8", "freq":"7902.13" }
];

function addSine(buf, freq, amp, phase, add, include, sampleRate) {
    if (!include) return;
    const rate = sampleRate || kSampleRate;
    const len = buf.length;
    for (let i = 0; i < len; ++i) {
        const val = Math.sin(freq * kPI_2 * i / rate + phase);
        if (add) {
            buf[i] = buf[i] + (val * amp * gain);
        } else {
            buf[i] = val * amp * gain;
        }
    }
}

function wave(id, freq, amp, phase, enabled) {
    this.id = id;
    this.freq = freq;
    this.amp = amp;
    this.phase = phase;
    this.enabled = enabled;
}

function addSines(buf, waves) {
    const rate = (typeof aud !== 'undefined' && aud) ? aud.sampleRate : kSampleRate;
    for (let i = 0; i < waves.length; i++) {
        addSine(buf, waves[i].freq, waves[i].amp, waves[i].phase, (i < waves.length), waves[i].enabled, rate);
    }
}

function draw(showWave) {
    waveVisible = showWave;
    c.width = c.width;

    const w = c.width;
    const h = c.height;
    const cx = w / 2;
    const cy = h / 2;

    // CRT phosphor background
    const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    bgGrad.addColorStop(0, "#0a140a");
    bgGrad.addColorStop(0.6, "#060f06");
    bgGrad.addColorStop(1, "#020802");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Vignette
    const vig = ctx.createRadialGradient(cx, cy, w * 0.1, cx, cy, Math.max(w, h) * 0.75);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(0.7, "rgba(0,0,0,0.15)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    // Graticule - 10 horizontal x 8 vertical major divisions
    const divX = w / 10;
    const divY = h / 8;

    // Minor grid (5 subdivisions)
    ctx.beginPath();
    ctx.strokeStyle = "rgba(80, 200, 100, 0.035)";
    ctx.lineWidth = 1;
    for (let x = divX * 0.2; x < w; x += divX * 0.2) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, h);
    }
    for (let y = divY * 0.2; y < h; y += divY * 0.2) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();

    // Major grid
    ctx.beginPath();
    ctx.strokeStyle = "rgba(80, 200, 100, 0.09)";
    ctx.lineWidth = 1;
    for (let x = divX; x < w; x += divX) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, h);
    }
    for (let y = divY; y < h; y += divY) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();

    // Center axes
    ctx.beginPath();
    ctx.strokeStyle = "rgba(100, 220, 140, 0.18)";
    ctx.lineWidth = 1;
    ctx.moveTo(cx + 0.5, 0);
    ctx.lineTo(cx + 0.5, h);
    ctx.moveTo(0, cy + 0.5);
    ctx.lineTo(w, cy + 0.5);
    ctx.stroke();

    // Tick marks on center axes
    ctx.beginPath();
    ctx.strokeStyle = "rgba(100, 220, 140, 0.35)";
    ctx.lineWidth = 1;
    for (let x = divX; x < w; x += divX) {
        ctx.moveTo(x + 0.5, cy - 6);
        ctx.lineTo(x + 0.5, cy + 6);
    }
    for (let y = divY; y < h; y += divY) {
        ctx.moveTo(cx - 6, y + 0.5);
        ctx.lineTo(cx + 6, y + 0.5);
    }
    ctx.stroke();

    // Phosphor persistence
    if (persistFrames.length > 0) {
        persistFrames.forEach((frame, i) => {
            const alpha = 0.18 * Math.pow(0.55, persistFrames.length - 1 - i);
            ctx.strokeStyle = `rgba(100, 255, 160, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.beginPath();
            let first = true;
            for (let x = 0; x < w; x++) {
                const y = frame[x];
                if (y !== undefined) {
                    if (first) { ctx.moveTo(x, y); first = false; }
                    else { ctx.lineTo(x, y); }
                }
            }
            ctx.stroke();
        });
    }

    // Current waveform
    if (showWave && buf && buf.length > 0) {
        const currentFrame = new Array(w);
        ctx.beginPath();
        let first = true;
        for (let x = 0; x < w; ++x) {
            const sample = Math.min(buf.length - 1, Math.round(x * zoom));
            const y = cy + buf[sample] * -divY * 3.5;
            currentFrame[x] = y;
            if (first) { ctx.moveTo(x, y); first = false; }
            else { ctx.lineTo(x, y); }
        }
        // Main trace - bright phosphor green
        ctx.strokeStyle = "#64ffa0";
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(100, 255, 160, 0.9)";
        ctx.shadowBlur = 6;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Bright core
        ctx.beginPath();
        first = true;
        for (let x = 0; x < w; ++x) {
            const y = currentFrame[x];
            if (first) { ctx.moveTo(x, y); first = false; }
            else { ctx.lineTo(x, y); }
        }
        ctx.strokeStyle = "rgba(200, 255, 220, 0.95)";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Update persistence
        persistFrames.push(currentFrame);
        if (persistFrames.length > MAX_PERSIST) persistFrames.shift();
    }

    // Scanlines
    ctx.beginPath();
    ctx.strokeStyle = "rgba(0, 40, 0, 0.12)";
    ctx.lineWidth = 1;
    for (let y = 0; y < h; y += 2) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();

    // CRT corner bezel hints
    ctx.strokeStyle = "rgba(40, 80, 40, 0.25)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    const r = 18;
    const inset = 4;
    ctx.moveTo(inset + r, inset);
    ctx.lineTo(w - inset - r, inset);
    ctx.moveTo(w - inset, inset + r);
    ctx.lineTo(w - inset, h - inset - r);
    ctx.moveTo(w - inset - r, h - inset);
    ctx.lineTo(inset + r, h - inset);
    ctx.moveTo(inset, h - inset - r);
    ctx.lineTo(inset, inset + r);
    ctx.stroke();

    // Scale readouts
    const sampleRate = getSampleRate();
    const msPerDiv = (divX * zoom) / sampleRate * 1000;
    ctx.font = "11px 'SF Mono', 'Monaco', 'Inconsolata', monospace";
    ctx.fillStyle = "rgba(120, 220, 160, 0.55)";
    ctx.textAlign = "left";
    ctx.fillText(`TIME/DIV ${msPerDiv.toFixed(2)}ms`, 12, 18);
    ctx.textAlign = "right";
    ctx.fillText(`V/DIV ${(gain * 1.4).toFixed(1)}V`, w - 12, 18);
    ctx.textAlign = "left";
    ctx.fillText(`COUPLING DC`, 12, h - 10);
    ctx.textAlign = "right";
    ctx.fillText(`TRIG AUTO`, w - 12, h - 10);
}
</script>

<script>
// Safari-friendly AudioContext: create lazily on first user gesture (Play button),
// and create the buffer at the AudioContext's *actual* sample rate (often 48000 on
// Safari/iOS). Creating the context at load time suspends it in Safari until a
// user gesture; creating the buffer at a hardcoded 44100 when the context runs
// at 48000 caused silent/broken playback on Safari.
let aud = null;
let buffer = null;
let buf = null;
let sourceNode = null;
let looping = false;
let waveVisible = false;
let waves = [];

function ensureAudioContext() {
    if (!aud) {
        const AC = window.AudioContext || window.webkitAudioContext;
        aud = new AC();
        const rate = aud.sampleRate;
        buffer = aud.createBuffer(1, Math.round(kNumSamples * rate / kSampleRate), rate);
        buf = buffer.getChannelData(0);
        clearBuffer();
        addSines(buf, waves);
        draw(waveVisible);
        powerOn();
    }
    return aud;
}

function powerOn() {
    const led = document.getElementById("powerLed");
    if (led) led.classList.add("on");
}

function clearBuffer() {
    for (let i = 0; i < buf.length; ++i) {
        buf[i] = 0.0;
    }
}

function play() {
    ensureAudioContext();
    if (aud.state === "suspended") {
        aud.resume();
    }
    stop();
    const node = aud.createBufferSource();
    node.buffer = buffer;
    node.loop = looping;
    node.connect(aud.destination);
    node.onended = function() { if (node === sourceNode) sourceNode = null; };
    node.start(0);
    sourceNode = node;
}

function stop() {
    if (sourceNode) {
        try { sourceNode.stop(); } catch (e) { }
        sourceNode = null;
    }
    const led = document.getElementById("powerLed");
    if (led) led.classList.remove("on");
}

function toggleLoop(checkbox) {
    looping = checkbox.checked;
    if (sourceNode) sourceNode.loop = looping;
}

function setZoom(slider) {
    zoom = slider.value / 100;
    document.getElementById("zoom").textContent = zoom.toFixed(2) + "x";
    draw(waveVisible);
}

function toggleWave(id) {
    ensureAudioContext();
    for (let i = 0; i < waves.length; i++) {
        if (waves[i].id == id) {
            waves[i].enabled = !waves[i].enabled;
        }
    }
    clearBuffer();
    addSines(buf, waves);
    draw(true);
}

function clearWaveforms() {
    ensureAudioContext();
    clearBuffer();
    waves = [];
    draw(false);
    const tbody = document.getElementById("wave_table").tBodies[0];
    while (tbody.rows.length > 0) {
        tbody.deleteRow(0);
    }
}

function setGain(slider) {
    ensureAudioContext();
    document.getElementById("gain").textContent = slider.value;
    gain = slider.value / 100;
    clearBuffer();
    addSines(buf, waves);
    draw(true);
}

function addWaves(add) {
    if (add) {
        ensureAudioContext();
        clearBuffer();
        addSines(buf, waves);
        draw(true);
    }
}

function findWave(id) {
    for (let i = 0; i < waves.length; i++) {
        if (waves[i].id == id) {
            return waves[i];
        }
    }
    return null;
}

function updateFreqFromDD(id) {
    const freq = document.getElementById(id + '_freq');
    const dd = document.getElementById(id + '_note');
    const wav = findWave(id);
    if (wav) wav.freq = dd.value;
    freq.value = dd.value;
    if (wav) addWaves(wav.enabled);
}

function updateFreq(id) {
    const freq = document.getElementById(id + '_freq');
    const dd = document.getElementById(id + '_note');
    dd.selectedIndex = 0;
    const wav = findWave(id);
    if (wav) {
        wav.freq = freq.value;
        addWaves(wav.enabled);
    }
}

function updateAmp(slider) {
    const id = slider.id.substring(4);
    const wav = findWave(id);
    if (wav) {
        wav.amp = slider.value / 100;
        addWaves(wav.enabled);
    }
}

function updatePhase(slider) {
    const id = slider.id.substring(6);
    const wav = findWave(id);
    if (wav) {
        wav.phase = slider.value / 100 * Math.PI * 2;
        addWaves(wav.enabled);
    }
}

function makeEnabledToggle(id, enabled) {
    const cell = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = enabled ? "toggle on" : "toggle";
    pill.textContent = enabled ? "ON" : "OFF";
    pill.addEventListener("click", function() {
        const on = pill.classList.toggle("on");
        pill.textContent = on ? "ON" : "OFF";
        toggleWave(id);
    });
    cell.appendChild(pill);
    return cell;
}

function makeRemoveButton(id) {
    const cell = document.createElement("td");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ghost";
    btn.textContent = "✕";
    btn.title = "Remove wave";
    btn.addEventListener("click", function() { removeWave(id); });
    cell.appendChild(btn);
    return cell;
}

function removeWave(id) {
    ensureAudioContext();
    waves = waves.filter(function(w) { return w.id != id; });
    const row = document.getElementById(id + "_freq").closest("tr");
    if (row) row.remove();
    clearBuffer();
    addSines(buf, waves);
    draw(waves.length > 0);
}

let nextId = 0;

function addRow(opts) {
    ensureAudioContext();
    opts = opts || {};
    const freq = opts.freq != null ? opts.freq : kFrequency;
    const amp = opts.amp != null ? opts.amp : 0.5;
    const phase = opts.phase != null ? opts.phase : 0;
    const enabled = !!opts.enabled;
    const id = (Date.now() * 1000) + (nextId++);

    waves.push(new wave(id, freq, amp, phase, enabled));

    const tbody = document.getElementById("wave_table").tBodies[0];
    const row = tbody.insertRow(-1);

    const freqCell = row.insertCell(-1);
    const freqInput = document.createElement("input");
    freqInput.type = "text";
    freqInput.id = id + "_freq";
    freqInput.value = freq;
    freqInput.addEventListener("change", function() { updateFreq(id); });
    freqCell.appendChild(freqInput);

    const ampCell = row.insertCell(-1);
    const ampInput = document.createElement("input");
    ampInput.type = "range";
    ampInput.min = "1";
    ampInput.max = "100";
    ampInput.id = "amp_" + id;
    ampInput.value = Math.round(amp * 100);
    ampInput.className = "range";
    ampInput.addEventListener("input", function() { updateAmp(this); });
    ampCell.appendChild(ampInput);

    const phaseCell = row.insertCell(-1);
    const phaseInput = document.createElement("input");
    phaseInput.type = "range";
    phaseInput.min = "0";
    phaseInput.max = "360";
    phaseInput.id = "phase_" + id;
    phaseInput.value = Math.round(phase * 100 / (Math.PI * 2));
    phaseInput.className = "range";
    phaseInput.addEventListener("input", function() { updatePhase(this); });
    phaseCell.appendChild(phaseInput);

    const noteCell = row.insertCell(-1);
    const select = document.createElement("select");
    select.name = "notes";
    select.id = id + "_note";
    select.addEventListener("change", function() { updateFreqFromDD(id); });
    const none = document.createElement("option");
    none.value = "-1";
    none.textContent = "None";
    select.appendChild(none);
    for (let i = 0; i < notes.length; i++) {
        const option = document.createElement("option");
        option.value = notes[i].freq;
        option.textContent = notes[i].note;
        select.appendChild(option);
    }
    noteCell.appendChild(select);

    row.appendChild(makeEnabledToggle(id, enabled));
    row.appendChild(makeRemoveButton(id));
    return id;
}

function loadPreset(shape) {
    ensureAudioContext();
    clearWaveforms();
    const f0 = kFrequency;
    const partials = 8;
    for (let n = 1; n <= partials; n++) {
        let amp = 0;
        let phase = 0;
        if (shape === "sine") {
            if (n > 1) continue;
            amp = 1;
        } else if (shape === "saw") {
            amp = 1 / n;
        } else if (shape === "square") {
            if (n % 2 === 0) continue;
            amp = 1 / n;
        } else if (shape === "triangle") {
            if (n % 2 === 0) continue;
            amp = 1 / (n * n);
            phase = (n % 4 === 3) ? Math.PI : 0;
        }
        addRow({ freq: f0 * n, amp: amp * 0.8, phase: phase, enabled: true });
    }
    clearBuffer();
    addSines(buf, waves);
    draw(true);
}
</script>

<div id="controls" class="panel controls">
    <div class="control">
        <label for="gain_slider">Gain</label>
        <input name="gain_slider" type="range" min="1" max="200" value="80" id="gain_slider" oninput="setGain(this)">
        <span class="readout" id="gain">80</span>
    </div>
    <div class="control">
        <label for="zoom_slider">Zoom</label>
        <input name="zoom_slider" type="range" min="20" max="800" value="100" id="zoom_slider" oninput="setZoom(this)">
        <span class="readout" id="zoom">1.00x</span>
    </div>
    <div class="control">
        <label for="loop_toggle">Loop</label>
        <input type="checkbox" id="loop_toggle" onchange="toggleLoop(this)">
    </div>
    <div class="spacer"></div>
    <button type="button" onclick="play()">▶ Play</button>
    <button type="button" class="secondary small" onclick="stop()">■ Stop</button>
    <button type="button" class="secondary small" onclick="clearWaveforms()">Clear</button>
</div>

<div class="panel presets">
    <span class="label">Presets</span>
    <button type="button" class="secondary small" onclick="loadPreset('sine')">Sine</button>
    <button type="button" class="secondary small" onclick="loadPreset('saw')">Sawtooth</button>
    <button type="button" class="secondary small" onclick="loadPreset('square')">Square</button>
    <button type="button" class="secondary small" onclick="loadPreset('triangle')">Triangle</button>
</div>

<div class="panel">
    <table id="wave_table">
        <thead>
        <tr>
            <th>Frequency Hz</th>
            <th>Amplitude</th>
            <th>Phase (°)</th>
            <th>Note</th>
            <th>Enabled</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <button type="button" class="secondary add-row" onclick="addRow()">+ Add Wave</button>
</div>
</div>
</body>
</html>
