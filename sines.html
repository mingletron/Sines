<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tek Sines — Oscilloscope</title>
<style>
:root {
    --bg: #040806;
    --panel: #0a150a;
    --panel-2: #0f1a0f;
    --border: #1a351a;
    --text: #c8e8c8;
    --muted: #6a8a6a;
    --accent: #4aff8a;
    --accent-dim: #2ac86a;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px 60px;
    background: radial-gradient(1200px 600px at 50% -10%, #081208, var(--bg));
    color: var(--text);
    font: 400 14px/1.5 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace;
}
.app { max-width: 1000px; margin: 0 auto; }
header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
}
header .brand { display: flex; align-items: center; gap: 10px; }
#powerLed {
    width: 12px; height: 12px; border-radius: 50%;
    background: #1a0; border: 2px solid #060;
    box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 8px #0a0;
    transition: all 0.3s ease;
}
#powerLed.on {
    background: #0f0; border-color: #0a0;
    box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 18px #0f0, 0 0 36px #0f0;
    animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 18px #0f0, 0 0 36px #0f0; }
    50% { opacity: 0.7; box-shadow: 0 0 0 2px #0d1a0d, inset 0 0 4px #020, 0 0 12px #0f0, 0 0 24px #0f0; }
}
header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; color: var(--accent); }
header .sub { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }

.screen {
    position: relative;
    padding: 16px;
    background: #040806;
    border: 3px solid #0d1a0d;
    border-radius: 18px;
    box-shadow:
        0 0 0 2px #0a150a,
        0 0 0 4px #142814,
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 120px rgba(80, 200, 120, 0.02),
        inset 0 0 0 1px rgba(80, 200, 120, 0.05);
    overflow: hidden;
}
.screen::before {
    content: "";
    position: absolute; inset: 16px; border-radius: 8px; pointer-events: none; z-index: 10;
    background:
        radial-gradient(ellipse 80% 60% at 50% 50%, transparent 60%, rgba(0,0,0,0.5) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.06), rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    background-size: 100% 100%, 100% 4px;
}
.screen::after {
    content: "";
    position: absolute; inset: 14px; pointer-events: none; border-radius: 10px; z-index: 11;
    box-shadow:
        inset 0 0 0 1px rgba(80, 200, 120, 0.1),
        inset 0 0 80px rgba(80, 200, 120, 0.03),
        inset 0 -40px 60px rgba(80, 200, 120, 0.02);
}
.screens { display: flex; gap: 16px; flex-wrap: wrap; }
.screens > .screen { flex: 1 1 460px; min-width: 0; margin: 0; }
.screen-label {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 12; pointer-events: none;
    font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(120, 220, 160, 0.45);
}
.scope-canvas {
    display: block; width: 100%; height: auto; border-radius: 6px;
    background: #020602;
}

.panel {
    margin-top: 18px; padding: 16px 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
}
.controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.control { display: flex; align-items: center; gap: 10px; }
.control > label { color: var(--muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
.readout {
    min-width: 50px; padding: 5px 10px;
    text-align: center; font-variant-numeric: tabular-nums; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--accent); font-family: inherit;
}
.spacer { flex: 1; }

button {
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 9px 18px; cursor: pointer;
    color: #06210f;
    background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    border: none; border-radius: 10px;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
    transition: transform .06s ease, filter .15s ease, border-color .15s ease, color .15s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.secondary {
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); box-shadow: none;
}
button.secondary:hover { border-color: var(--accent); color: var(--accent); filter: none; }
button.small { padding: 7px 13px; font-size: 12px; }
button.ghost {
    color: var(--muted); background: transparent;
    border: 1px solid var(--border); box-shadow: none;
    padding: 5px 11px; font-size: 12px; line-height: 1;
}
button.ghost:hover { color: #ff7676; border-color: #ff7676; filter: none; }

input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 6px; margin: 0;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #06210f;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
}
input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 2px solid #06210f;
}

input[type=text], select {
    font: inherit; font-size: 13px;
    padding: 6px 9px; width: 92px;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px;
}
select { width: auto; }
input[type=text]:focus, select:focus, input[type=range]:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
}

table { width: 100%; border-collapse: collapse; margin-top: 4px; }
thead th {
    padding: 8px 12px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--border);
}
tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

.toggle {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 54px; padding: 4px 0;
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    cursor: pointer; user-select: none; border-radius: 999px;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--border);
    transition: color .15s ease, background .15s ease, border-color .15s ease;
}
.toggle.on { color: var(--accent); background: rgba(74, 222, 128, 0.15); border-color: var(--accent-dim); }

.add-row { margin-top: 16px; }

.presets { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.presets .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-right: 2px; }
</style>
</head>
<body>
<div class="app">
<header>
    <div class="brand">
        <span id="powerLed"></span>
        <strong>TEK SINES</strong>
    </div>
    <h1>OSCILLOSCOPE</h1>
    <span class="sub">additive sine synthesis</span>
</header>
<div class="screens">
    <div class="screen">
        <span class="screen-label">Wave</span>
        <canvas id="waveCanvas" class="scope-canvas" width="640" height="480" data-mode="wave">
            Your browser does not support the HTML5 canvas tag.
        </canvas>
    </div>
    <div class="screen">
        <span class="screen-label">Spectrum</span>
        <canvas id="specCanvas" class="scope-canvas" width="640" height="480" data-mode="spec">
            Your browser does not support the HTML5 canvas tag.
        </canvas>
    </div>
</div>

<div id="controls" class="panel controls">
    <div class="control">
        <label for="gainSlider">Gain</label>
        <input name="gain_slider" type="range" min="1" max="200" value="80" id="gainSlider">
        <span class="readout" id="gainReadout">80</span>
    </div>
    <div class="control">
        <label for="zoomSlider">Zoom</label>
        <input name="zoom_slider" type="range" min="20" max="800" value="100" id="zoomSlider">
        <span class="readout" id="zoomReadout">1.00x</span>
    </div>
    <div class="control">
        <label for="loopToggle">Loop</label>
        <input type="checkbox" id="loopToggle">
    </div>
    <div class="spacer"></div>
    <button type="button" id="playBtn">▶ Play</button>
    <button type="button" class="secondary small" id="stopBtn">■ Stop</button>
    <button type="button" class="secondary small" id="clearBtn">Clear</button>
</div>

<div class="panel presets">
    <span class="label">Presets</span>
    <button type="button" class="secondary small preset-btn" data-preset="sine">Sine</button>
    <button type="button" class="secondary small preset-btn" data-preset="saw">Sawtooth</button>
    <button type="button" class="secondary small preset-btn" data-preset="square">Square</button>
    <button type="button" class="secondary small preset-btn" data-preset="triangle">Triangle</button>
</div>

<div class="panel">
    <table id="waveTable">
        <thead>
        <tr>
            <th>Frequency Hz</th>
            <th>Amplitude</th>
            <th>Phase (°)</th>
            <th>Note</th>
            <th>Enabled</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <button type="button" class="secondary add-row" id="addWaveBtn">+ Add Wave</button>
</div>
</div>

<script>
// ============================================================
// Constants
// ============================================================
const kSampleRate = 44100;
const kNumSamples = kSampleRate * 2;
const kFrequency  = 440;
const kPI_2       = Math.PI * 2;
const MAX_PERSIST = 4;
const FFT_SIZE    = 4096;   // radix-2 FFT window (must be a power of 2)
const LOG2_FFT    = 12;     // log2(FFT_SIZE)
const FREQ_MAX    = 4000;   // displayed frequency span, Hz

// ============================================================
// Note frequency table (87-tone piano from C0 to B8)

    { note: "B8", freq: "7902.13" },

// ============================================================
// State
// ============================================================
let gain = 0.8;
let zoom = 1;
let waves = [];
let looping = false;
let waveVisible = false;
let nextId = 0;

let aud = null;
let buffer = null;
let buf = null;
let sourceNode = null;

const persistFrames = [];

// Spectrum (frequency-domain) cache + precomputed FFT tables.
let spectrumDirty = true;
let spectrumCache = null;
let fftRe = null, fftIm = null, fftWin = null, fftBitRev = null, fftCosT = null, fftSinT = null;

// ============================================================
// Wave model
// ============================================================
class Wave {
    constructor(id, freq, amp, phase, enabled) {
        this.id = id;
        this.freq = freq;
        this.amp = amp;
        this.phase = phase;
        this.enabled = enabled;
    }
}

// ============================================================
// Audio buffer synthesis
// ============================================================
function getSampleRate() {
    return (aud && aud.sampleRate) ? aud.sampleRate : kSampleRate;
}

function clearBuffer() {
    buf.fill(0);
    spectrumDirty = true;
}

function writeSine(buf, freq, amp, phase, enabled, sampleRate) {
    if (!enabled) return;
    const rate = sampleRate || kSampleRate;
    const len = buf.length;
    for (let i = 0; i < len; ++i) {
        buf[i] += Math.sin(freq * kPI_2 * i / rate + phase) * amp * gain;
    }
}

function writeSines(buf, waves) {
    const rate = getSampleRate();
    for (const w of waves) {
        writeSine(buf, w.freq, w.amp, w.phase, w.enabled, rate);
    }
}

function rebuildBuffer() {
    ensureAudioContext();
    clearBuffer();
    writeSines(buf, waves);
    draw(true);
}

// ============================================================
// Frequency analysis (FFT)
// ============================================================
// Precompute the Hann window, bit-reversal permutation, and twiddle factors
// for FFT_SIZE once. All buffers are reused across calls.
function ensureFftTables() {
    if (fftWin) return;
    const N = FFT_SIZE;
    fftRe = new Float32Array(N);
    fftIm = new Float32Array(N);
    fftWin = new Float32Array(N);
    for (let i = 0; i < N; i++) {
        fftWin[i] = 0.5 - 0.5 * Math.cos(kPI_2 * i / (N - 1));
    }
    fftBitRev = new Uint32Array(N);
    for (let i = 0; i < N; i++) {
        let x = i, r = 0;
        for (let b = 0; b < LOG2_FFT; b++) { r = (r << 1) | (x & 1); x >>= 1; }
        fftBitRev[i] = r;
    }
    const half = N / 2;
    fftCosT = new Float32Array(half);
    fftSinT = new Float32Array(half);
    for (let i = 0; i < half; i++) {
        fftCosT[i] = Math.cos(-kPI_2 * i / N);
        fftSinT[i] = Math.sin(-kPI_2 * i / N);
    }
}

// In-place iterative radix-2 Cooley–Tukey FFT. re/im are Float32Arrays of length N.
function fft(re, im) {
    const N = re.length;
    for (let i = 0; i < N; i++) {
        const j = fftBitRev[i];
        if (j > i) {
            let t = re[i]; re[i] = re[j]; re[j] = t;
            t = im[i]; im[i] = im[j]; im[j] = t;
        }
    }
    for (let len = 2; len <= N; len <<= 1) {
        const half = len >> 1;
        const step = N / len;
        for (let i = 0; i < N; i += len) {
            for (let k = 0; k < half; k++) {
                const ti = k * step;
                const c = fftCosT[ti], s = fftSinT[ti];
                const a = i + k, b = a + half;
                const reB = re[b] * c - im[b] * s;
                const imB = re[b] * s + im[b] * c;
                re[b] = re[a] - reB;
                im[b] = im[a] - imB;
                re[a] += reB;
                im[a] += imB;
            }
        }
    }
}

// Returns a Float32Array of bin magnitudes (length FFT_SIZE/2), cached until the
// next clearBuffer() marks it dirty. The FFT is taken over the first FFT_SIZE
// samples of buf with a Hann window to reduce spectral leakage.
function computeSpectrum() {
    if (!buf || buf.length === 0) return null;
    ensureFftTables();
    if (spectrumDirty || !spectrumCache) {
        const N = FFT_SIZE;
        const n = Math.min(N, buf.length);
        for (let i = 0; i < N; i++) {
            fftRe[i] = i < n ? buf[i] * fftWin[i] : 0;
            fftIm[i] = 0;
        }
        fft(fftRe, fftIm);
        const half = N / 2;
        const mags = new Float32Array(half);
        for (let i = 0; i < half; i++) {
            mags[i] = Math.sqrt(fftRe[i] * fftRe[i] + fftIm[i] * fftIm[i]);
        }
        spectrumCache = mags;
        spectrumDirty = false;
    }
    return spectrumCache;
}

// ============================================================
// Canvas rendering
// ============================================================
function drawBackground(ctx, w, h) {
    const cx = w / 2;
    const cy = h / 2;

    const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    bgGrad.addColorStop(0, "#0a140a");
    bgGrad.addColorStop(0.6, "#060f06");
    bgGrad.addColorStop(1, "#020802");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const vig = ctx.createRadialGradient(cx, cy, w * 0.1, cx, cy, Math.max(w, h) * 0.75);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(0.7, "rgba(0,0,0,0.15)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
}

function drawGraticule(ctx, w, h) {
    const cx = w / 2;
    const cy = h / 2;
    const divX = w / 10;
    const divY = h / 8;

    // Minor grid
    ctx.beginPath();
    ctx.strokeStyle = "rgba(80, 200, 100, 0.035)";
    ctx.lineWidth = 1;
    for (let x = divX * 0.2; x < w; x += divX * 0.2) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, h);
    }
    for (let y = divY * 0.2; y < h; y += divY * 0.2) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();

    // Major grid
    ctx.beginPath();
    ctx.strokeStyle = "rgba(80, 200, 100, 0.09)";
    ctx.lineWidth = 1;
    for (let x = divX; x < w; x += divX) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, h);
    }
    for (let y = divY; y < h; y += divY) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();

    // Center axes
    ctx.beginPath();
    ctx.strokeStyle = "rgba(100, 220, 140, 0.18)";
    ctx.lineWidth = 1;
    ctx.moveTo(cx + 0.5, 0);
    ctx.lineTo(cx + 0.5, h);
    ctx.moveTo(0, cy + 0.5);
    ctx.lineTo(w, cy + 0.5);
    ctx.stroke();

    // Tick marks on center axes
    ctx.beginPath();
    ctx.strokeStyle = "rgba(100, 220, 140, 0.35)";
    ctx.lineWidth = 1;
    for (let x = divX; x < w; x += divX) {
        ctx.moveTo(x + 0.5, cy - 6);
        ctx.lineTo(x + 0.5, cy + 6);
    }
    for (let y = divY; y < h; y += divY) {
        ctx.moveTo(cx - 6, y + 0.5);
        ctx.lineTo(cx + 6, y + 0.5);
    }
    ctx.stroke();
}

function drawPersistenceFrames(ctx, w, h) {
    if (persistFrames.length === 0) return;
    persistFrames.forEach((frame, i) => {
        const alpha = 0.18 * Math.pow(0.55, persistFrames.length - 1 - i);
        ctx.strokeStyle = `rgba(100, 255, 160, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        let first = true;
        for (let x = 0; x < w; x++) {
            const y = frame[x];
            if (y !== undefined) {
                if (first) { ctx.moveTo(x, y); first = false; }
                else { ctx.lineTo(x, y); }
            }
        }
        ctx.stroke();
    });
}

function drawWaveform(ctx, w, h) {
    const cy = h / 2;
    const divY = h / 8;
    const currentFrame = new Array(w);

    // Dim trace (phosphor persistence)
    ctx.beginPath();
    let first = true;
    for (let x = 0; x < w; ++x) {
        const sample = Math.min(buf.length - 1, Math.round(x * zoom));
        const y = cy + buf[sample] * -divY * 3.5;
        currentFrame[x] = y;
        if (first) { ctx.moveTo(x, y); first = false; }
        else { ctx.lineTo(x, y); }
    }
    ctx.strokeStyle = "#64ffa0";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(100, 255, 160, 0.9)";
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Bright core
    ctx.beginPath();
    first = true;
    for (let x = 0; x < w; ++x) {
        const y = currentFrame[x];
        if (first) { ctx.moveTo(x, y); first = false; }
        else { ctx.lineTo(x, y); }
    }
    ctx.strokeStyle = "rgba(200, 255, 220, 0.95)";
    ctx.lineWidth = 1;
    ctx.stroke();

    persistFrames.push(currentFrame);
    if (persistFrames.length > MAX_PERSIST) persistFrames.shift();
}

function drawSpectrum(ctx, w, h) {
    const mags = computeSpectrum();
    if (!mags) return;
    const rate = getSampleRate();
    const binHz = rate / FFT_SIZE;
    const maxBin = Math.min(mags.length, Math.ceil(FREQ_MAX / binHz));

    // Auto-normalize to the tallest visible peak so relative bar heights are preserved.
    let maxMag = 0;
    for (let i = 1; i < maxBin; i++) if (mags[i] > maxMag) maxMag = mags[i];
    if (maxMag <= 0) return;

    const baseY = h - 26;
    const topY = 26;
    const span = baseY - topY;

    // Each x pixel maps to a frequency bin; drawn as a glowing vertical bar.
    ctx.beginPath();
    ctx.strokeStyle = "#64ffa0";
    ctx.lineWidth = 2;
    ctx.lineCap = "butt";
    ctx.shadowColor = "rgba(100, 255, 160, 0.9)";
    ctx.shadowBlur = 6;
    for (let x = 0; x < w; x++) {
        const freq = (x / w) * FREQ_MAX;
        let bin = Math.round(freq / binHz);
        if (bin < 1) bin = 1;
        if (bin >= maxBin) continue;
        const barH = (mags[bin] / maxMag) * span;
        ctx.moveTo(x + 0.5, baseY);
        ctx.lineTo(x + 0.5, baseY - barH);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Baseline
    ctx.beginPath();
    ctx.strokeStyle = "rgba(100, 220, 140, 0.25)";
    ctx.lineWidth = 1;
    ctx.moveTo(0, baseY + 0.5);
    ctx.lineTo(w, baseY + 0.5);
    ctx.stroke();
}

function drawScanlines(ctx, w, h) {
    ctx.beginPath();
    ctx.strokeStyle = "rgba(0, 40, 0, 0.12)";
    ctx.lineWidth = 1;
    for (let y = 0; y < h; y += 2) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(w, y + 0.5);
    }
    ctx.stroke();
}

function drawBezel(ctx, w, h) {
    ctx.strokeStyle = "rgba(40, 80, 40, 0.25)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    const r = 18;
    const inset = 4;
    ctx.moveTo(inset + r, inset);
    ctx.lineTo(w - inset - r, inset);
    ctx.moveTo(w - inset, inset + r);
    ctx.lineTo(w - inset, h - inset - r);
    ctx.moveTo(w - inset - r, h - inset);
    ctx.lineTo(inset + r, h - inset);
    ctx.moveTo(inset, h - inset - r);
    ctx.lineTo(inset, inset + r);
    ctx.stroke();
}

function drawReadouts(ctx, w, h, mode) {
    ctx.font = "11px 'SF Mono', 'Monaco', 'Inconsolata', monospace";
    ctx.fillStyle = "rgba(120, 220, 160, 0.55)";

    if (mode === "spec") {
        ctx.textAlign = "left";
        ctx.fillText(`FREQ SPAN 0–${(FREQ_MAX / 1000).toFixed(1)}kHz`, 12, 18);
        ctx.textAlign = "right";
        ctx.fillText("REF AUTO", w - 12, 18);
        ctx.textAlign = "left";
        ctx.fillText(`FFT ${FFT_SIZE}`, 12, h - 10);
        ctx.textAlign = "right";
        ctx.fillText("LIN", w - 12, h - 10);
        return;
    }

    const sampleRate = getSampleRate();
    const divX = w / 10;
    const msPerDiv = (divX * zoom) / sampleRate * 1000;
    ctx.textAlign = "left";
    ctx.fillText(`TIME/DIV ${msPerDiv.toFixed(2)}ms`, 12, 18);
    ctx.textAlign = "right";
    ctx.fillText(`V/DIV ${(gain * 1.4).toFixed(1)}V`, w - 12, 18);
    ctx.textAlign = "left";
    ctx.fillText("COUPLING DC", 12, h - 10);
    ctx.textAlign = "right";
    ctx.fillText("TRIG AUTO", w - 12, h - 10);
}

// Paints one CRT screen: background → graticule → content → scanlines → bezel → readouts.
// `content` draws the screen-specific trace between the graticule and the scanlines.
function paintScope(canvas, content) {
    canvas.width = canvas.width; // clear
    const w = canvas.width;
    const h = canvas.height;
    const ctx = canvas.getContext("2d");
    const mode = canvas.dataset.mode || "wave";

    drawBackground(ctx, w, h);
    drawGraticule(ctx, w, h);
    content(ctx, w, h);
    drawScanlines(ctx, w, h);
    drawBezel(ctx, w, h);
    drawReadouts(ctx, w, h, mode);
}

function draw(showWave) {
    waveVisible = showWave;

    const waveCanvas = document.getElementById("waveCanvas");
    if (waveCanvas) {
        paintScope(waveCanvas, function (ctx, w, h) {
            drawPersistenceFrames(ctx, w, h);
            if (showWave && buf && buf.length > 0) {
                drawWaveform(ctx, w, h);
            }
        });
    }

    const specCanvas = document.getElementById("specCanvas");
    if (specCanvas) {
        paintScope(specCanvas, function (ctx, w, h) {
            if (buf && buf.length > 0) {
                drawSpectrum(ctx, w, h);
            }
        });
    }
}

// ============================================================
// Web Audio API
// ============================================================
function ensureAudioContext() {
    if (!aud) {
        const AC = window.AudioContext || window.webkitAudioContext;
        aud = new AC();
        const rate = aud.sampleRate;
        buffer = aud.createBuffer(1, Math.round(kNumSamples * rate / kSampleRate), rate);
        buf = buffer.getChannelData(0);
        clearBuffer();
        writeSines(buf, waves);
        draw(waveVisible);
        setPowerLed(true);
    }
    return aud;
}

function setPowerLed(on) {
    const led = document.getElementById("powerLed");
    if (!led) return;
    led.classList.toggle("on", on);
}

function play() {
    ensureAudioContext();
    if (aud.state === "suspended") {
        aud.resume();
    }
    stop();
    const node = aud.createBufferSource();
    node.buffer = buffer;
    node.loop = looping;
    node.connect(aud.destination);
    node.onended = function () {
        if (node === sourceNode) sourceNode = null;
    };
    node.start(0);
    sourceNode = node;
    setPowerLed(true);
}

function stop() {
    if (sourceNode) {
        try { sourceNode.stop(); } catch (e) { /* already stopped */ }
        sourceNode = null;
    }
    setPowerLed(false);
}

function toggleLoop() {
    looping = document.getElementById("loopToggle").checked;
    if (sourceNode) sourceNode.loop = looping;
}

// ============================================================
// Wave lookup
// ============================================================
function findWave(id) {
    return waves.find(function (w) { return w.id == id; }) || null;
}

// ============================================================
// UI — Event handlers
// ============================================================
function setGain(value) {
    gain = value / 100;
    document.getElementById("gainReadout").textContent = value;
    rebuildBuffer();
}

function setZoom(value) {
    zoom = value / 100;
    document.getElementById("zoomReadout").textContent = zoom.toFixed(2) + "x";
    draw(waveVisible);
}

function toggleWave(id) {
    const w = findWave(id);
    if (w) w.enabled = !w.enabled;
    ensureAudioContext();
    rebuildBuffer();
}

function clearWaveforms() {
    ensureAudioContext();
    clearBuffer();
    waves = [];
    draw(false);
    const tbody = document.getElementById("waveTable").tBodies[0];
    while (tbody.rows.length > 0) {
        tbody.deleteRow(0);
    }
}

function removeWave(id) {
    waves = waves.filter(function (w) { return w.id != id; });
    const row = document.getElementById(id + "_freq").closest("tr");
    if (row) row.remove();
    ensureAudioContext();
    clearBuffer();
    writeSines(buf, waves);
    draw(waves.length > 0);
}

function updateFreqFromDD(id) {
    const freq = document.getElementById(id + "_freq");
    const dd = document.getElementById(id + "_note");
    const w = findWave(id);
    if (!w) return;
    w.freq = dd.value;
    freq.value = dd.value;
    if (w.enabled) rebuildBuffer();
}

function updateFreq(id) {
    const freq = document.getElementById(id + "_freq");
    const dd = document.getElementById(id + "_note");
    dd.selectedIndex = 0;
    const w = findWave(id);
    if (!w) return;
    w.freq = freq.value;
    if (w.enabled) rebuildBuffer();
}

function updateAmp(slider) {
    const id = slider.id.replace("amp_", "");
    const w = findWave(id);
    if (!w) return;
    w.amp = slider.value / 100;
    if (w.enabled) rebuildBuffer();
}

function updatePhase(slider) {
    const id = slider.id.replace("phase_", "");
    const w = findWave(id);
    if (!w) return;
    w.phase = slider.value / 100 * Math.PI * 2;
    if (w.enabled) rebuildBuffer();
}

// ============================================================
// UI — Row construction
// ============================================================
function makeEnabledToggle(id, enabled) {
    const cell = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = enabled ? "toggle on" : "toggle";
    pill.textContent = enabled ? "ON" : "OFF";
    pill.addEventListener("click", function () {
        const on = pill.classList.toggle("on");
        pill.textContent = on ? "ON" : "OFF";
        toggleWave(id);
    });
    cell.appendChild(pill);
    return cell;
}

function makeRemoveButton(id) {
    const cell = document.createElement("td");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ghost";
    btn.textContent = "✕";
    btn.title = "Remove wave";
    btn.addEventListener("click", function () { removeWave(id); });
    cell.appendChild(btn);
    return cell;
}

function addRow(opts) {
    ensureAudioContext();
    opts = opts || {};
    const freq = opts.freq != null ? opts.freq : kFrequency;
    const amp  = opts.amp != null ? opts.amp : 0.5;
    const phase = opts.phase != null ? opts.phase : 0;
    const enabled = !!opts.enabled;
    const id = Date.now() * 1000 + nextId++;

    waves.push(new Wave(id, freq, amp, phase, enabled));

    const tbody = document.getElementById("waveTable").tBodies[0];
    const row = tbody.insertRow(-1);

    // Frequency text input
    const freqCell = row.insertCell(-1);
    const freqInput = document.createElement("input");
    freqInput.type = "text";
    freqInput.id = id + "_freq";
    freqInput.value = freq;
    freqInput.addEventListener("change", function () { updateFreq(id); });
    freqCell.appendChild(freqInput);

    // Amplitude slider
    const ampCell = row.insertCell(-1);
    const ampSlider = document.createElement("input");
    ampSlider.type = "range";
    ampSlider.min = "1";
    ampSlider.max = "100";
    ampSlider.id = "amp_" + id;
    ampSlider.value = Math.round(amp * 100);
    ampSlider.className = "range";
    ampSlider.addEventListener("input", function () { updateAmp(this); });
    ampCell.appendChild(ampSlider);

    // Phase slider
    const phaseCell = row.insertCell(-1);
    const phaseSlider = document.createElement("input");
    phaseSlider.type = "range";
    phaseSlider.min = "0";
    phaseSlider.max = "360";
    phaseSlider.id = "phase_" + id;
    phaseSlider.value = Math.round(phase * 100 / (Math.PI * 2));
    phaseSlider.className = "range";
    phaseSlider.addEventListener("input", function () { updatePhase(this); });
    phaseCell.appendChild(phaseSlider);

    // Note dropdown
    const noteCell = row.insertCell(-1);
    const select = document.createElement("select");
    select.name = "notes";
    select.id = id + "_note";
    select.addEventListener("change", function () { updateFreqFromDD(id); });
    const none = document.createElement("option");
    none.value = "-1";
    none.textContent = "None";
    select.appendChild(none);
    for (const n of notes) {
        const option = document.createElement("option");
        option.value = n.freq;
        option.textContent = n.note;
        select.appendChild(option);
    }
    noteCell.appendChild(select);

    row.appendChild(makeEnabledToggle(id, enabled));
    row.appendChild(makeRemoveButton(id));

    return id;
}

// ============================================================
// Presets
// ============================================================
function loadPreset(shape) {
    clearWaveforms();
    const f0 = kFrequency;
    const partials = 8;
    for (let n = 1; n <= partials; n++) {
        let amp = 0;
        let phase = 0;
        if (shape === "sine") {
            if (n > 1) continue;
            amp = 1;
        } else if (shape === "saw") {
            amp = 1 / n;
        } else if (shape === "square") {
            if (n % 2 === 0) continue;
            amp = 1 / n;
        } else if (shape === "triangle") {
            if (n % 2 === 0) continue;
            amp = 1 / (n * n);
            phase = (n % 4 === 3) ? Math.PI : 0;
        }
        addRow({ freq: f0 * n, amp: amp * 0.8, phase: phase, enabled: true });
    }
    rebuildBuffer();
}

// ============================================================
// DOM initialization
// ============================================================
document.getElementById("gainSlider").addEventListener("input", function () {
    setGain(this.value);
});
document.getElementById("zoomSlider").addEventListener("input", function () {
    setZoom(this.value);
});
document.getElementById("loopToggle").addEventListener("change", toggleLoop);
document.getElementById("playBtn").addEventListener("click", play);
document.getElementById("stopBtn").addEventListener("click", stop);
document.getElementById("clearBtn").addEventListener("click", clearWaveforms);
document.getElementById("addWaveBtn").addEventListener("click", addRow);

document.querySelectorAll(".preset-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
        loadPreset(this.dataset.preset);
    });
});

// Light up both scopes with their graticule at startup (buf is still empty).
draw(false);
</script>
</body>
